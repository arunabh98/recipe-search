[project]
name = "recipe-search"
version = "0.1.0"
description = "Simmer — natural-language recipe search and recommendations (Exa + Claude)"
readme = "README.md"
authors = [
    { name = "Arunabh", email = "arunabhghosh98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
recipe-search = "recipe_search:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
